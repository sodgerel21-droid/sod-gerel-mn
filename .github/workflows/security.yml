name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: gerege-systems/nexus-gerege-private/.github/workflows/distribution-security.yml@main
    secrets:
      PRIVATE_NEXUS_TOKEN: ${{ secrets.PRIVATE_NEXUS_TOKEN }}
