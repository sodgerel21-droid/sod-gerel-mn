name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    uses: gerege-systems/nexus-gerege-private/.github/workflows/distribution-ci.yml@main
    secrets:
      PRIVATE_NEXUS_TOKEN: ${{ secrets.PRIVATE_NEXUS_TOKEN }}
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n deploy/*.sh
      - name: Validate isolated production stack
        env:
          POSTGRES_PASSWORD: validation-only
          SSO_DEFAULT_CLIENT_SECRET: validation-only
          INTEGRATION_ENCRYPTION_KEY: validation-only
          PUSH_TOKEN_ENCRYPTION_KEY: validation-only
          IMAGE_TAG: validation-only
        run: docker compose config --quiet
      - name: Validate core pin and brand
        run: python3 deploy/check-config.py
      - name: Unit passport geometry (every demo unit)
        run: node tools/passport-check.mjs
      - name: Apartment plan geometry, DXF import and furnishing
        run: node --test tools/plan-tests.mjs
  images:
    needs: [backend, configuration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve locked core
        id: core
        run: |
          source core.lock
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: gerege-systems/nexus-gerege-private
          ref: ${{ steps.core.outputs.sha }}
          token: ${{ secrets.PRIVATE_NEXUS_TOKEN }}
          path: .build/core
          persist-credentials: false
      - name: Prepare brand assets
        run: |
          mkdir -p .build/core/frontend/public/brand
          cp brand/*.svg .build/core/frontend/public/brand/
      - uses: actions/setup-node@v6
        if: matrix.component == 'frontend'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .build/core/frontend/package-lock.json
      - name: Frontend checks
        if: matrix.component == 'frontend'
        working-directory: .build/core/frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm ci
          npm test
          npm run lint
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component == 'backend' && '.' || '.build/core/frontend' }}
          file: ${{ matrix.component == 'backend' && 'deploy/Dockerfile' || '.build/core/frontend/Dockerfile' }}
          build-contexts: |
            core=.build/core
          secrets: |
            github_token=${{ secrets.PRIVATE_NEXUS_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/gerege-systems/e-property-mn/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
