# Install only after the certificate exists (certbot certonly --webroot).
server {
    listen 80;
    server_name e-property.mn mobile.e-property.mn admin.e-property.mn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name e-property.mn;
    ssl_certificate /etc/letsencrypt/live/e-property.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-property.mn/privkey.pem;
    client_max_body_size 25m;
    # Public landing (landing/index.html), published by rollout.sh; every other path is Nexus.
    location = / {
        root /var/www/e-property-mn/current;
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    # 3D demo viewer and unit passports (landing/3d/, landing/units/), same release as the landing.
    location ~ ^/(3d|units|scan)/ {
        root /var/www/e-property-mn/current;
        types { text/html html; text/javascript js; application/json json; model/gltf-binary glb; application/dxf dxf; image/webp webp; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    # Universal Links: unit pages open in the phone app (mobile-brand/, team CQTHTD6YJQ).
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "max-age=3600" always;
        return 200 '{"applinks":{"details":[{"appIDs":["CQTHTD6YJQ.mn.eproperty.app"],"components":[{"/":"/units/*"}]}]}}';
    }
    location = /ready { deny all; }
    location = /metrics { deny all; }
    location ^~ /api/platform/ { deny all; }
    location ~ ^/(api/|oauth2/|\.well-known/|health$) {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
# Phone app device line (docs/mobile-app-prompt.mn.md): the native shell's work
# area. Same upstreams as e-property.mn; "/" is the unit list, not the static landing.
server {
    listen 443 ssl;
    server_name mobile.e-property.mn;
    ssl_certificate /etc/letsencrypt/live/mobile.e-property.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile.e-property.mn/privkey.pem;
    client_max_body_size 25m;
    # The app's home is the unit list (landing/units/); passports and 3D as on e-property.mn.
    location = / {
        root /var/www/e-property-mn/current;
        try_files /units/index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    # Server-driven routes for the phone app (core native-apps README): which own paths
    # open a native screen or the system browser instead of the work area.
    location = /.well-known/gerege-shell-routes.json {
        alias /var/www/e-property-mn/current/shell-routes.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(3d|units|scan)/ {
        root /var/www/e-property-mn/current;
        types { text/html html; text/javascript js; application/json json; model/gltf-binary glb; application/dxf dxf; image/webp webp; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
    location = /ready { deny all; }
    location = /metrics { deny all; }
    location ^~ /api/platform/ { deny all; }
    location ~ ^/(api/|oauth2/|\.well-known/|health$) {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
# Operator console (core deploy/nginx/admin.nexus.gerege.mn.conf): same two upstreams,
# its own host. No address allowlist here by decision (2026-10-04): the API runs with
# CONTROL_PLANE_ALLOW_ALL=true and the console's password + TOTP are the gate.
limit_req_zone $binary_remote_addr zone=cp_auth:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name admin.e-property.mn;
    ssl_certificate /etc/letsencrypt/live/admin.e-property.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.e-property.mn/privkey.pem;
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /ready { deny all; }
    location = /metrics { deny all; }
    # Sign-in and the second factor: their own budget, apart from the public login.
    location ~ ^/api/platform/v1/(session|session/eid/start|step-up)$ {
        limit_req zone=cp_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(api/|cp/api) {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    # On this host the root is the console.
    location = / { return 308 /cp; }
    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
